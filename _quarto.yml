project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notes/*.qmd"
  resources:
    # Binds the custom domain; must land in _site for `quarto publish` to deploy it.
    - CNAME

website:
  title: "Nicholas L. Smith"
  description: "PhD student in economics at Emory University. Health economics, labor economics, and causal inference."
  site-url: "https://nicholaslsmith.com"
  navbar:
    background: light
    search: false
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: cv.qmd
        text: CV
    # NOTE: notes/index.qmd and teaching.qmd are deliberately absent from the
    # nav. Both still build and are reachable by URL. To publish either, add:
    #   - href: teaching.qmd
    #     text: Teaching
    #   - href: notes/index.qmd
    #     text: Notes
  page-footer:
    left: "&copy; 2026 Nicholas L. Smith"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: false
    link-external-newwindow: true
